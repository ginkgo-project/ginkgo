sonar.projectKey=ginkgo-project_ginkgo
sonar.organization=ginkgo-project
sonar.pullrequest.github.repository=ginkgo-project/ginkgo

sonar.cfamily.threads=10

sonar.sources=.
sonar.tests=.
sonar.exclusions=third_party/**,build/**,doc/**,assets/**,**/test/**
sonar.test.inclusions=**/test/**
sonar.coverage.exclusions=third_party/**,build/**,benchmark/**,doc/**,examples/**,assets/**,**/test/**

# Rules that conflict with deliberate Ginkgo conventions:
# nested namespace blocks, uniform kernel signatures, kernel lambdas with [&],
# private constructors behind create(), intended implicit conversions,
# void* in allocator/copy interfaces, C arrays in kernels, and complexity
# limits that do not suit numerical kernels.
# Unused parameters are only ignored where every backend must share a signature.
sonar.issue.ignore.multicriteria=\
    nested_namespaces,\
    many_parameters,\
    nesting_depth,\
    cognitive_complexity,\
    lambda_length,\
    many_methods,\
    many_fields,\
    make_unique,\
    default_capture,\
    this_capture,\
    explicit_ctor,\
    void_pointer,\
    hidden_friend,\
    c_array,\
    std_byte,\
    protected_member,\
    shell_positional_params,\
    shell_explicit_return,\
    unused_param_reference,\
    unused_param_omp,\
    unused_param_cuda,\
    unused_param_hip,\
    unused_param_dpcpp,\
    unused_param_common,\
    unused_param_device_hooks
sonar.issue.ignore.multicriteria.nested_namespaces.ruleKey=cpp:S5812
sonar.issue.ignore.multicriteria.nested_namespaces.resourceKey=**/*
