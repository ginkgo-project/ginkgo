sonar.projectKey=ginkgo-project_ginkgo
sonar.organization=ginkgo-project
sonar.pullrequest.github.repository=ginkgo-project/ginkgo
sonar.host.url=https://sonarcloud.io

sonar.cfamily.threads=10
sonar.cfamily.compile-commands=build/bw-output/compile_commands.json
sonar.cfamily.gcov.reportsPath=build/Testing/CoverageInfo

sonar.sources=.
sonar.tests=.
sonar.exclusions="third_party/**, build/**, doc/**, assets/**, **/test/**"
sonar.test.inclusions="**/test/**"
sonar.coverage.exclusions="third_party/**, build/**, benchmark/**, doc/**, examples/**, assets/**, **/test/**"
