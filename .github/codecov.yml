# Coverage comes from .github/workflows/coverage.yml.
coverage:
  status:
    # shown on pull requests without failing them
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
parsers:
  cobertura:
    # line coverage: a line counts as covered even if some of its branches were not taken
    partials_as_hits: true
