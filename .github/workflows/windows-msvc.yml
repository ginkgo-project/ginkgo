name: Windows-MSVC

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'release/**'
    tags:
      - '**'
  pull_request:
    types: [opened,synchronize,labeled]
    paths-ignore:
      - 'doc/**'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled by `debug_enabled` keyword (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

concurrency:
  # runs for labels that don't start the full test get their own group,
  # so that they don't cancel running builds
  group: >-
    ${{ github.workflow }}-${{ (github.head_ref && (github.event.action != 'labeled'
    || (github.event.label.name == '1:ST:ready-to-merge' && !contains(github.event.pull_request.labels.*.name, '1:ST:run-full-test'))
    || (github.event.label.name == '1:ST:run-full-test' && !contains(github.event.pull_request.labels.*.name, '1:ST:ready-to-merge')))
    && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  windows:
    # runs on all pull requests, but of the label events only on adding a full-test label
    if: >-
      github.event.action != 'labeled'
      || (github.event.label.name == '1:ST:ready-to-merge' && !contains(github.event.pull_request.labels.*.name, '1:ST:run-full-test'))
      || (github.event.label.name == '1:ST:run-full-test' && !contains(github.event.pull_request.labels.*.name, '1:ST:ready-to-merge'))
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 runs only outside of pull requests or on pull requests with a full-test label
        os: >-
          ${{ fromJSON((github.event_name != 'pull_request'
          || contains(github.event.pull_request.labels.*.name, '1:ST:ready-to-merge')
          || contains(github.event.pull_request.labels.*.name, '1:ST:run-full-test'))
          && '["windows-2022", "windows-latest"]' || '["windows-latest"]') }}
    name: msvc/${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout the latest code (shallow clone)
      uses: actions/checkout@v4
    - name: Debug over SSH (tmate)
      uses: mxschmitt/action-tmate@v3.5
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled }}
      with:
        limit-access-to-actor: true

    - name: configure and test
      run: |
        $env:ChocolateyInstall = Convert-Path "$((Get-Command choco).Path)\..\.."
        Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
        refreshenv
        mkdir build
        cd build
        cmake -DGINKGO_BUILD_OMP=OFF -DGINKGO_ENABLE_HALF=OFF -DGINKGO_ENABLE_BFLOAT16=OFF ..
        cmake --build . -j4 --config Release
        ctest . -C Release
