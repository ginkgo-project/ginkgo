name: Benchmark trigger

# Twice a week, starts the CSCS CI pipeline "benchmark"
# (.gitlab/cscs-benchmark.yml) for develop's head, on the machines that have no
# run of it on the results branch of ginkgo-project/cb-dashboard. On Saturday
# nights it starts the pipeline's distributed jobs instead (16 nodes, 1 to 64
# GPUs), for the machines without a distributed run of develop's head. The
# dashboard at cb.gko-project.org imports the results. The logic is
# `python -m automation trigger` in cb-dashboard.
on:
  schedule:
    - cron: "17 3 * * 1,4"
    # the distributed jobs
    - cron: "0 22 * * 6"
  workflow_dispatch:
    inputs:
      machines:
        description: "Machines, comma-separated; empty for all"
        default: ""
      force:
        description: "Trigger even if the commit has runs"
        type: boolean
        default: false
      distributed:
        description: "The distributed jobs instead of the single-node ones"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trigger:
    if: github.repository == 'ginkgo-project/ginkgo' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ginkgo-project/cb-dashboard
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trigger the benchmark pipeline
        env:
          CSCS_CI_REPOSITORY_ID: ${{ secrets.CSCS_CI_REPOSITORY_ID }}
          CSCS_CI_WEBHOOK_SECRET: ${{ secrets.CSCS_CI_WEBHOOK_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          MACHINES: ${{ inputs.machines }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          DISTRIBUTED: ${{ (github.event.schedule == '0 22 * * 6' || inputs.distributed) && '--distributed' || '' }}
        run: python -m automation trigger --sha "$GITHUB_SHA" ${MACHINES:+--machines "$MACHINES"} $FORCE $DISTRIBUTED
