name: CI-Extra

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'develop'
      - 'release/**'
    tags:
      - '**'
  pull_request:
    types: [opened,synchronize,labeled]
    paths-ignore:
      - 'doc/**'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled by `debug_enabled` keyword (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

concurrency:
  # runs for labels that don't sns for labels that don't start the full test get their own group,
  # so that they don't cancel running builds
  group: >-
    extra-${{ github.workflow }}-${{ (github.head_ref && (github.event.action != 'labeled'
    || (github.event.label.name == '1:ST:ready-to-merge' && !contains(github.event.pull_request.labels.*.name, '1:ST:run-full-test'))
    || (github.event.label.name == '1:ST:run-full-test' && !contains(github.event.pull_request.labels.*.name, '1:ST:ready-to-merge')))
    && github.ref) || github.run_id }}
  cancel-in-progress: true

# The label conditions are defined once in the first job and reused by the
# other jobs through the YAML anchors &run and &with. The platform workflows
# only check inputs.full to decide whether to run their full set of jobs.
jobs:
  arm:
    # runs on all pull requests, but of the label events only on adding a full-test label
    if: &run >-
      !contains(github.event.pull_request.labels.*.name, '1:ST:SKIP_ALL_CI') && (
      (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, '1:ST:run-full-test') 
                                            || contains(github.event.pull_request.labels.*.name, '1:ST:ready-to-merge')))
      || (github.event.action == 'labeled' && ((github.event.label.name == '1:ST:ready-to-merge' 
                                                && !contains(github.event.pull_request.labels.*.name, '1:ST:run-full-test'))
                                               || (github.event.label.name == '1:ST:run-full-test' 
                                                   && !contains(github.event.pull_request.labels.*.name, '1:ST:ready-to-merge')))))
    uses: ./.github/workflows/arm.yml
    with: &with
      full: true

  osx:
    if: *run
    uses: ./.github/workflows/osx.yml
    with: *with

  windows-msvc-cuda:
    if: *run
    uses: ./.github/workflows/windows-msvc-cuda.yml
    with: *with

  windows-msvc-mpi:
    if: *run
    uses: ./.github/workflows/windows-msvc-mpi.yml
    with: *with
