# Templates with reasonable defaults for builds and tests
.default_variables:
  variables:
    CXX_COMPILER: "g++"
    CUDA_COMPILER: "nvcc"
    BUILD_TYPE: "Debug"
    BUILD_SHARED_LIBS: "ON"
    BUILD_REFERENCE: "ON"
    BUILD_OMP: "OFF"
    BUILD_CUDA: "OFF"
    BUILD_HIP: "OFF"
    BUILD_SYCL: "OFF"
    BUILD_HWLOC: "ON"
    BUILD_MPI: "OFF"
    MPI_AS_ROOT: "OFF"
    FAST_TESTS: "OFF"
    NONDEFAULT_STREAM: "OFF"
    DPCPP_SINGLE_MODE: "OFF"
    MIXED_PRECISION: "ON"
    ENABLE_HALF: "ON"
    ENABLE_BFLOAT16: "OFF"
    CXX_FLAGS: "-Wpedantic"
    EXTRA_CMAKE_FLAGS: ""
    CI_PROJECT_DIR_SUFFIX: ""
    CUDA_ARCH: ""
    MDOULE_LOAD: ""
    SPACK_LOAD: ""
    ONEAPI_DEVICE_SELECTOR: ""
