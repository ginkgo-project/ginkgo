# Entry point for the CSCS CI (https://docs.cscs.ch/services/cicd/).
#
# This file is not part of the gitlab.com pipeline in .gitlab-ci.yml. CSCS
# mirrors the GitHub repository into its own GitLab instance, runs this file
# there and submits the jobs to the Alps clusters through FirecREST. Which
# branches and pull requests trigger it is configured on the CSCS CI setup
# page. CSCS specifics: CI_PIPELINE_SOURCE is always `trigger`, and
# `rules: changes` has no effect.
#
# The jobs run on Daint's Grace-Hopper nodes (4 GH200 per node). Nodes are not
# shared and are billed as a whole, so each job builds Ginkgo and runs all
# tests within the same Slurm job, using all 4 GPUs for the tests.

include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - test

variables:
  UENV: prgenv-gnu/26.3:v1

.daint_build_and_test:
  extends: .baremetal-runner-daint-gh200
  stage: test
  variables:
    GIT_STRATEGY: fetch
    SLURM_JOB_NUM_NODES: 1
    # must be quoted, otherwise Slurm reads the value as minutes
    SLURM_TIMELIMIT: "01:30:00"
    CXX: g++
    CUDAHOSTCXX: g++
    BUILD_TYPE: Release
    # a node has 288 cores, but nvcc processes need several GB each
    BUILD_JOBS: 64
    CTEST_JOBS: 64
    OMP_NUM_THREADS: 64
    EXTRA_CMAKE_FLAGS: ""
  script:
    # The baremetal runner does not download the uenv. Downloaded images are
    # kept in $SCRATCH/.uenv-images, which is exempt from the scratch cleanup,
    # so this only pulls once per uenv version. The lock keeps jobs from
    # pulling the same image concurrently.
    - flock ${SCRATCH}/.ginkgo-ci-uenv-pull.lock bash -c
        "uenv image inspect ${UENV} > /dev/null 2>&1 || uenv image pull ${UENV}"
    # GCC fuses multiplications and additions on ARM by default, which changes
    # the rounding enough for some tests to fail, so turn that off (like in
    # .github/workflows/arm.yml).
    - uenv run --view=default ${UENV} -- cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_CXX_FLAGS=-ffp-contract=off
        -DGINKGO_BUILD_CUDA=ON -DGINKGO_CUDA_ARCHITECTURES=90
        -DGINKGO_BUILD_OMP=ON -DGINKGO_DEVEL_TOOLS=OFF
        -DGINKGO_BUILD_TESTS=ON -DGINKGO_BUILD_EXAMPLES=OFF
        -DGINKGO_BUILD_BENCHMARKS=OFF
        -DCMAKE_DISABLE_FIND_PACKAGE_Kokkos=ON
        ${EXTRA_CMAKE_FLAGS}
    - uenv run --view=default ${UENV} -- cmake --build build --parallel ${BUILD_JOBS}
    - cd build
    # srun calls of the MPI tests inherit the uenv loaded by `uenv run`
    - CTEST_JUNIT_DIR=${CI_PROJECT_DIR}/test-results
        uenv run --view=default ${UENV} -- bash ../.gitlab/run-ctest.sh
  artifacts:
    when: always
    reports:
      junit: test-results/*.xml

# Multi-GPU tests with GPU-aware Cray MPICH. The uenv links Cray MPICH to its
# GTL library, which additionally needs MPICH_GPU_SUPPORT_ENABLED=1 at runtime.
# The MPI tests are launched with srun and use up to 8 processes. Without
# MPIEXEC_MAX_NUMPROCS, CMake detects only 1 and disables all MPI tests.
.daint_mpi:
  variables:
    SLURM_NTASKS: 8
    SLURM_CPUS_PER_TASK: 32
    MPICH_GPU_SUPPORT_ENABLED: 1
    MPI_CMAKE_FLAGS: -DGINKGO_BUILD_MPI=ON -DGINKGO_FORCE_GPU_AWARE_MPI=ON
      -DMPIEXEC_EXECUTABLE=srun -DMPIEXEC_MAX_NUMPROCS=8

daint/cuda131/cray-mpich/gcc/omp/debug/shared:
  extends: [.daint_build_and_test, .daint_mpi]
  variables:
    BUILD_TYPE: Debug
    SLURM_TIMELIMIT: "02:00:00"
    EXTRA_CMAKE_FLAGS: ${MPI_CMAKE_FLAGS}

# The previous uenv version, for a second toolchain (CUDA 12.9, GCC 14.2,
# Cray MPICH 8.1.32), combined with static libraries and GPU-aware MPI.
daint/cuda129/cray-mpich/gcc/omp/release/static:
  extends: [.daint_build_and_test, .daint_mpi]
  variables:
    UENV: prgenv-gnu/25.11:v1
    SLURM_TIMELIMIT: "02:00:00"
    EXTRA_CMAKE_FLAGS: -DBUILD_SHARED_LIBS=OFF ${MPI_CMAKE_FLAGS}
